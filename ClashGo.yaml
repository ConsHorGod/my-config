subscribe: https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6/ClashGo.yaml
mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
bind-address: "*"
external-controller: 127.0.0.1:60000
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
block-quic: true
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-only-cn-private.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
profile:
  store-selected: true
  store-fake-ip: true
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>隧道<<<<<<<<<<<<<<<<<<<<
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>DNS模組<<<<<<<<<<<<<<<<<<<<
dns:
  enable: true
  ipv6: false
  listen: :23453
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    #- 'geosite: gfw'
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>代理節點<<<<<<<<<<<<<<<<<<<<
proxies:
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>策略組<<<<<<<<<<<<<<<<<<<<
proxy-groups:
  - name: 全球互聯
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - 國際媒體
      - 其它節點
      - FNY(救急用)
      - DIRECT
  - name: 國際媒體
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ForeignMedia.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - XMR(D)香港
      - LXY香港
  - name: 微軟服務
    icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Windows_11.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    proxies:
      - 國際媒體
      - DIRECT
  - name: 黃暴嘔爆
    icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/HBO_Max.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - XMR(D)香港
      - LXY香港
  - name: 遊戲平台
    icon: "https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/steam(1).png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    proxies:
      - DIRECT
      - 國際媒體
  - name: iOS系統更新
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Puzzle.png"
    hidden: false
    type: select
    proxies:
      - DIRECT
      - REJECT-DROP
  - name: iOS系統通知
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png"
    hidden: false
    type: select
    proxies:
      - DIRECT
      - 國際媒體
  - name: 其它節點
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/AAEX.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: '^(?!.*(US 0|JP 0|TW 0|过期|客户端|推荐|官网|失联|发布|流量|剩余|群|套餐|客服|费利蒙|硅谷|拉斯维加斯|洛杉矶|RU|圣何塞|圣克拉拉|西雅图|芝加哥|🇭🇰|香港|HK|Hong|川日|东京|大阪|泉日|埼玉|Japan|🇨🇳|🇹🇼|狮|Singapore|🇰🇷|韩国|首尔|KR|Korea)).*$'
    use:
      - XMR(D)
      - LXY
  - name: XMR(D)香港
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"
    hidden: false
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: '香港'
    use:
      - XMR(D)
  - name: XMR(D)日本
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png"
    hidden: false
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: '日本'
    use:
      - XMR(D)
  - name: LXY香港
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"
    hidden: false
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: '香港'
    use:
      - "LXY"
  - name: FNY(救急用)
    icon: "https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Rookie.png"
    hidden: false
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FNY
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>機場訂閱<<<<<<<<<<<<<<<<<<<<
proxy-providers:
  FNY:
    type: http
    path: ./provide/FNY.yml
    url: https://388583885.459245.xyz/api/v1/client/subscribe?token=0e79462ce42ab0413ed58d454329934e
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
  XMR(D):
    type: http
    path: ./provide/XMR(D).yml
    url: https://cdn2.xmrth.one/s/9dkc7icn1whs-dd913f47?clash=1
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
  LXY:
    type: http
    path: ./provide/LXY.yml
    url: https://liangxin.xyz/api/v1/liangxin?OwO=548c8c140641cb099ddce75922e0ba6d
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>規則模板<<<<<<<<<<<<<<<<<<<<
rule-anchor:
  classical: &classical
    type: http
    interval: 21600
    behavior: classical
    format: yaml
  domain: &domain
    type: http
    interval: 21600
    behavior: domain
    format: mrs
  ipcidr: &ipcidr
    type: http
    interval: 21600
    behavior: ipcidr
    format: mrs
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>規則集<<<<<<<<<<<<<<<<<<<<
rule-providers:
  My_DIRECT:
    <<: *classical
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_DIRECT.yaml"
  My_PROXY:
    <<: *classical
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_PROXY.yaml"
  My_REJECT:
    <<: *classical
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_REJECT.yaml"
  Clash_iOS_UPDATE:
    <<: *classical
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_iOS_UPDATE.yaml"
  Clash_iOS_PUSH:
    <<: *classical
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_iOS_PUSH.yaml"
  anti-ad:
    <<: *domain
    url: "https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs"
  ASN-CN:
    <<: *classical
    url: "https://yfamilys.com/rule/ASN-CN.rule"
  ChinaMax_Domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ConsHorGod/Clash_mrs/main/ruleset/ChinaMax_Domain.mrs"
  Proxy_Domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ConsHorGod/Clash_mrs/main/ruleset/Proxy_Domain.mrs"
  TikTok:
    <<: *classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok_No_Resolve.yaml"
  AI:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"
  Steam:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs"
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>分流規則<<<<<<<<<<<<<<<<<<<<
rules:
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - RULE-SET,Clash_iOS_PUSH,iOS系統通知,no-resolve
  - RULE-SET,Clash_iOS_UPDATE,iOS系統更新,no-resolve
  - RULE-SET,My_REJECT,REJECT-DROP,no-resolve
  - RULE-SET,anti-ad,REJECT-DROP,no-resolve
  - RULE-SET,Steam,遊戲平台,no-resolve
  - RULE-SET,My_PROXY,國際媒體,no-resolve
  - RULE-SET,AI,XMR(D)日本,no-resolve
  - RULE-SET,TikTok,XMR(D)日本,no-resolve
  - RULE-SET,Proxy_Domain,國際媒體,no-resolve
  - RULE-SET,My_DIRECT,DIRECT,no-resolve
  - RULE-SET,ASN-CN,DIRECT,no-resolve
  - RULE-SET,ChinaMax_Domain,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,全球互聯,dns-failed