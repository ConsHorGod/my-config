#⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️分流規則⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
rules:
#------------------80,443以外端口一律直連------------------
  - DST-PORT,0-79,CN,no-resolve  #0-79端口
  - DST-PORT,81-442,CN,no-resolve  #81-442端口
  - DST-PORT,444-65535,CN,no-resolve  #444-65535端口
#------------------優先規則------------------
  - DOMAIN,msmp.abchina.com.cn,REJECT,no-resolve  #排除中國農業銀行檢測
  - DOMAIN-KEYWORD,gdmf.apple.com,iOS更新,no-resolve  #iOS更新
  #- RULE-SET,anti-ad,AD-Block,no-resolve  #anti-ad廣告過濾
  - RULE-SET,DIRECT,CN,no-resolve  #我的直連網站
#------------------遊戲平台------------------
  - RULE-SET,Game,Game,no-resolve  #Steam遊戲平台
#------------------下載------------------
  - RULE-SET,下载軟件,CN,no-resolve  #下载軟件
  - RULE-SET,PT下载,CN,no-resolve  #PT下载
#------------------國外APP代理規則------------------
  - DOMAIN-KEYWORD,XMRth.cloud,XMRth,no-resolve  #XMRth機場
  - RULE-SET,Microsoft,Microsoft,no-resolve  #微軟服務
  - RULE-SET,AI,AI,no-resolve  #人工智能
  - RULE-SET,PROXY,國際媒體,no-resolve  #我的翻墻網站
  - RULE-SET,YouTube,國際媒體,no-resolve  #油管視頻
  - RULE-SET,Google,國際媒體,no-resolve  #谷歌搜索
  - RULE-SET,Telegram,Telegram,no-resolve  #電報
  - DOMAIN-KEYWORD,hbomax,HBOMAX,no-resolve  #HBOMAX
  - RULE-SET,HBOMAX,HBOMAX,no-resolve  #HBOMAX
  - DOMAIN-KEYWORD,tiktok,TikTok,no-resolve  #TikTok
  - RULE-SET,TikTok,TikTok,no-resolve  #TikTok
#------------------中國ASN、中國IP直連規則------------------
  - RULE-SET,ASN,CN  #中國自治系統號碼
  - GEOIP,CN,CN  #中國IP
#------------------流量最終出站------------------
  - MATCH,FINAL,dns-failed
