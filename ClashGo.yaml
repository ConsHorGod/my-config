.subscribe: https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6/ClashGo.yaml
mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
bind-address: "*"
external-controller: 127.0.0.1:60000
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
block-quic: true
geodata-mode: false
geox-url:
  mmdb: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-only-cn-private.mmdb"
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
profile:
  store-selected: true
  store-fake-ip: true
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>隧道<<<<<<<<<<<<<<<<<<<<
tun:
  enable: true
  device: mixed
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>DNS模塊<<<<<<<<<<<<<<<<<<<<
dns:
  enable: true
  ipv6: false
  listen: :23453
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter: []
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>代理節點<<<<<<<<<<<<<<<<<<<<
proxies:
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>策略組<<<<<<<<<<<<<<<<<<<<
proxy-groups:
  - name: 全球互联
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - 国际媒体
      - 其它节点
      - FNY(救急用)
      - 国内直连
  - name: 国际媒体
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ForeignMedia.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - XMR(D)香港
      - LXY香港
  - name: 微软服务
    icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Windows_11.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    proxies:
      - 国际媒体
      - 国内直连
  - name: 黄暴呕爆
    icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/HBO_Max.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - XMR(D)香港
      - LXY香港
  - name: 游戏平台
    icon: "https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/steam(1).png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    proxies:
      - 国内直连
      - 国际媒体
  - name: iOS系统更新
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Puzzle.png"
    hidden: false
    type: select
    proxies:
      - 国内直连
      - REJECT
  - name: iOS通知推送
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png"
    hidden: false
    type: select
    proxies:
      - 国内直连
      - 国际媒体
  - name: 其它节点
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/AAEX.png"
    hidden: false
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: '^(?!.*(US 0|JP 0|TW 0|过期|客户端|推荐|官网|失联|发布|流量|剩余|群|套餐|客服|费利蒙|硅谷|拉斯维加斯|洛杉矶|RU|圣何塞|圣克拉拉|西雅图|芝加哥|🇭🇰|香港|HK|Hong|川日|东京|大阪|泉日|埼玉|Japan|🇨🇳|🇹🇼|狮|Singapore|🇰🇷|韩国|首尔|KR|Korea)).*$'
    use:
      - XMR(D)
      - LXY
  - name: XMR(D)香港
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"
    hidden: false
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: '香港'
    use:
      - XMR(D)
  - name: XMR(D)日本
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png"
    hidden: false
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: '日本'
    use:
      - XMR(D)
  - name: LXY香港
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"
    hidden: false
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: '香港'
    use:
      - LXY
  - name: FNY(救急用)
    icon: "https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Rookie.png"
    hidden: false
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FNY
  - name: 国内直连
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/CN.png"
    hidden: true
    type: select
    url: http://mirrors.aliyun.com/generate_204
    interval: 300
    proxies:
      - DIRECT
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>機場訂閱<<<<<<<<<<<<<<<<<<<<
proxy-providers:
  FNY:
    type: http
    path: ./provide/FNY.yml
    url: https://388583885.459245.xyz/api/v1/client/subscribe?token=0e79462ce42ab0413ed58d454329934e
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
  XMR(D):
    type: http
    path: ./provide/XMR(D).yml
    url: https://cdn2.xmrth.one/s/9dkc7icn1whs-dd913f47?clash=1
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
  LXY:
    type: http
    path: ./provide/LXY.yml
    url: https://liangxin.xyz/api/v1/liangxin?OwO=548c8c140641cb099ddce75922e0ba6d
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>規則模板<<<<<<<<<<<<<<<<<<<<
rule-anchor:
  classical: &classical
    type: http
    interval: 21600
    behavior: classical
    format: yaml
  domain: &domain
    type: http
    interval: 21600
    behavior: domain
    format: mrs
  ipcidr: &ipcidr
    type: http
    interval: 21600
    behavior: ipcidr
    format: mrs
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>規則集<<<<<<<<<<<<<<<<<<<<
rule-providers:
  My_DIRECT:
    <<: *classical
    path: ./ruleset/Clash_DIRECT.yaml
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_DIRECT.yaml"
  My_PROXY:
    <<: *classical
    path: ./ruleset/Clash_PROXY.yaml
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_PROXY.yaml"
  My_REJECT:
    <<: *classical
    path: ./ruleset/My_REJECT.yaml
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_REJECT.yaml"
  anti-ad:
    <<: *domain
    url: "https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs"
  ChinaMax_Domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
  ChinaMax_IP:
    <<: *ipcidr
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
  lan_ip:
    <<: *ipcidr
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
  lan_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
  telegram:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"
  telegram_ip:
    <<: *ipcidr
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"
  TikTok:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs"
  HBOMAX:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/max.mrs"
  AI:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"
  Microsoft:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"
  Steam:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs"
  iOS_UPDATE:
    <<: *classical
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_iOS_UPDATE.yaml"
  iOS_PUSH:
    <<: *classical
    path: ./ruleset/iOS_PUSH.yaml
    url: "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_PUSH.yaml"
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>分流規則<<<<<<<<<<<<<<<<<<<<
rules:
  - RULE-SET,lan_domain,DIRECT,no-resolve
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - RULE-SET,iOS_PUSH,iOS通知推送,no-resolve
  - RULE-SET,iOS_UPDATE,iOS系统更新,no-resolve
  - RULE-SET,My_REJECT,REJECT-DROP,no-resolve
  - RULE-SET,anti-ad,REJECT-DROP,no-resolve
  - RULE-SET,My_DIRECT,国内直连,no-resolve
  - RULE-SET,ChinaMax_Domain,国内直连,no-resolve
  - RULE-SET,ChinaMax_IP,国内直连,no-resolve
  - RULE-SET,Steam,游戏平台,no-resolve
  - RULE-SET,Microsoft,微软服务,no-resolve
  - RULE-SET,AI,XMR(D)日本,no-resolve
  - RULE-SET,TikTok,XMR(D)日本,no-resolve
  - RULE-SET,My_PROXY,国际媒体,no-resolve
  - RULE-SET,HBOMAX,黄暴呕爆,no-resolve
  - MATCH,全球互联,dns-failed  - MATCH,全球互聯,dns-failed