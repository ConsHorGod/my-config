[MITM]
# ⚠️⚠️⚠️⚠️⚠️⚠️中間人攻擊解密⚠️⚠️⚠️⚠️⚠️⚠️
##>>>>>>>>安全警告：务必保持 false,确保 SSL 证书真实有效
skip-server-cert-verify = true
##>>>>>>>>开启 HTTP/2 协议支持,提升性能
h2 = true
##>>>>>>>>不可MitM也不应该被打断连接的域名,优先排除系统关键服务、流媒体、以及有 SSL Pinning 校验的 App,域名匹配逻辑：先排除敏感域名(-),最后留出位置给脚本注入(%INSERT%)
hostname = %INSERT% *.google.cn, -*.facebook.com, -*.cdninstagram.com, -*.instagram.com, -*.twitter.com, -*.snssdk.com, -*.pstatp.com, -*.bdstatic.com
##>>>>>>>>禁用列表中可以保留一些极其顽固、甚至连连接都不想让 Surge 碰的域名
hostname-disabled = %INSERT% gateway.icloud.com, gateway.icloud.com.cn, weather-data.apple.com, buy.itunes.apple.com
##>>>>>>>>以下是CA證書
ca-passphrase = 17CD519E
ca-p12 = 

