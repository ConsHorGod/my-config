#
#
# 只有obfs=http、obfs=ws、obfs=wss可以有可选的“obfs-uri”字段。
# wss中的obfs-host参数将用于TLS握手和HTTP标头主机字段，如果未为wss设置obfs-host，将使用服务器地址。
# 当使用obfs=ws和obfs=wss时，服务器端可以通过mux = 0的v2ray-plugin或v2ray-core或trojan-go进行部署。
# 值得注意的是，shadowsocks的udp-over-tcp仅由使用shadowsocksr python版本部署的服务器支持，其他版本仅支持UDP中继本身。如果您正在为shadowsocks梳理udp-relay和udp-over-tcp，您必须确保您的服务器使用shadowsocksr python版本进行部署。
# 值得注意的是，obfs=tls与obfs=over-tls不同。obfs=tls是与shadowsocks项目相关的混淆插件，它只是TLS协议的混淆。obfs=over-tls是TLS协议。Quantumult X支持两者的shadowsocks。
# obfs插件tls1.2_ticket_auth比tls1.2_ticket_fastauth和obfs tls多一个RTT，你最好改用tls1.2_ticket_fastauth。
# chacha20-ietf-poly1305和chacha20-poly1305方法在VMess配置中具有相同的效果。
# 用于SSL固定的tls-cert-sha256或tls-pubkey-sha256可以通过openssl使用以下命令生成：
# openssl x509 -noout -fingerprint -sha256 -inform pem -in your-cert.pem
# openssl x509 -inform pem -pubkey -noout < your-cert.pem | openssl pkey -pubin -outform der | openssl dgst -sha256
# 如果tls验证为false，那么tls-cert-sha256和tls-pubkey-sha256将被忽略。
# 如果设置了tls-pubkey-sha256，那么tls-cert-sha256将被忽略。
# TLS的可选tls-alpn是ALPN扩展内容的十六制格式，例如：“02:68:32:08:68:74:74:70:2f:31:2e:31”或“02683208687474702f312e31”表示ALPN“h2”和“http/1.1”（{2，'h'，'2'，8，'h'，'t'，'t'，'p'，'/'1'，'.'，'1'}）
# TLS的tls-no-session-ticket参数是可选的，这仅适用于特殊用例。默认情况下，会话票证已启用（tls-no-session-ticket=false）。如果您想禁用会话票证，只需设置tls-no-session-ticket=true，请记住，如果服务器支持会话ID，会话仍可能从会话ID中重用以进行新连接。
# TLS的tls-no-session-reuse参数是可选的，这仅适用于特殊用例。默认情况下，会话重用已启用（tls-no-session-reuse=false）。如果您想禁用会话重复使用，只需设置tls-no-session-reuse=true，这将迫使Quantumult X为每个新连接执行完整的TLS握手。
# tls13参数已被弃用（自v1.0.26起弃用），无论您设置什么，TLS版本1.3始终受支持。
# shadowsocks协议的obfs=http遵循shadowsocks项目的simple-obfs插件。VMess协议的obfs=http遵循V2Ray的实现。这2个混淆是完全不同的。有时为了遵守您的特殊服务器设置（“shadowsocks”+“VMess的http混淆”或“VMess”+“shadowsocks的http混淆”。后者很少发生，当V2Ray（或类似程序）部署了带有shadows协议和V2Ray内置http混淆时，就会发生前者，您可以为shadowsocks协议设置obfs=vemss-http，或为vmess协议设置obfs=shadowsocks-http。
#
[server_local]
;shadowsocks=example.com:80,method=chacha20,password=pwd,obfs=http,obfs-host=bing.com,obfs-uri=/resource/file,fast-open=false,udp-relay=false,server_check_url=http://www.apple.com/generate_204,tag=ss-obfs-http-01
;shadowsocks=example.com:80,method=chacha20,password=pwd,obfs=http,obfs-host=bing.com,obfs-uri=/resource/file,fast-open=false,udp-relay=false,tag=ss-obfs-http-02
;shadowsocks=example.com:443,method=chacha20,password=pwd,obfs=tls,obfs-host=bing.com,fast-open=false,udp-relay=false,tag=ss-obfs-tls-01
