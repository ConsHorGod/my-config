#
# 静态策略指向您手动选择的候選者中的服务器。
# 可用策略指向基于server_check_url（当策略触发且策略结果不可用时，并发网址延迟测试将立即启动候选的候选服务器。 如果当时没有网络请求接受该策略，这意味着该策略处于闲置状态，即使服务器停机，也不会启动测试。 那时，您可以通过手动启动测试来更新服务器状态，但这没有任何意义）。
# 循环策略指向候选的下一个连接服务器。
# dest-hash策略根据使用目标地址（域或IP）作为输入的哈希函数指向服务器。 此策略对于需要会话持久性的用例特别有用。 从策略中添加或删除服务器可能会改变结果。
# url-latency-benchmark策略指向具有最佳（参数公差ms）url延迟结果的服务器。 当用户在Quantumult X容器应用程序中手动启动网址测试时，策略结果也会更新。 此类型策略有一个名为检查间隔（秒）的参数，如果该策略已被任何请求激活，则将考虑该间隔。 如果动态检查为真，那么即使政策处于闲置状态，仍然会考虑间隔，并将启动基准。
# ssid 策略指向服务器，具体取决于网络环境。
# Param resource-tag-regex 和 server-tag-regex 仅适用于静态、可用和循环策略类型的策略。
#
