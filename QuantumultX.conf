# 样本 Quantumult 配置
# 以“;”或“#”或“//”开头的行应为评论。
# 以";"或"#"或"//"开头的行为注释行。
# SS-URI方案可以在https://shadowsocks.org/en/spec/SIP002-URI-Scheme.html上找到
# Quantumult使用HEAD方法向server_check_url发送HTTP请求来测试代理状态，结果应该是两个延迟，第一个是与代理服务器的TCP握手，第二个是HTTP延迟（Quantumult成功从server_check_url接收HTTP响应和Quantumult开始向server_check_url发送HTTP请求之间的持续时间）。闪电图标表示TCP快速打开成功。如果[server_local]部分或[server_remote]部分中的服务器有自己的server_check_url，则将使用其自己的server_check_url，而不是[general]部分中的server_check_url。
# Quantumult 使用 HTTP HEAD 方法对测试网址 server_check_url 进行网页响应性测试（测试结果为通过该节点访问此网页的 HTTP 延迟,即 HTTP 响应时间与 HTTP 请求发起时间的差值），来确认节点的可用性。
# Quantumult 界面中的延迟测试方式均为网页响应性测试，显示的最终延迟均为通过对应节点访问测试网页的 HTTP 延迟。
# 由于 Trojan 协议为无响应校验协议，使得 HTTP 检测方式即使获得了 HTTP 响应，也不代表节点一定可用。
# dns_exclusion_list包含禁用占位符IP(198.18.0.0/15)映射机制的域。不在dns_exclusion_list中的域启用了占位符IP映射机制，并具有所谓的“远程解决”效果。dns_exclusion_list中域的DNS查询可能遵循也可能不遵循[dns]部分的设置。
# 当全局选项“增强兼容性”在 misc 设置中关闭时，将考虑 enhanced_compatibility_ssid_list。
# udp_whitelist包含目标UDP端口，空表示所有端口都在udp_whitelist中。目标端口不在udp_whitelist中的UDP数据包（通过Quantumult隧道接口）将被丢弃，ICMP（端口无法访问）消息将被发回。此设置与过滤规则或策略无关，也与代理（服务器）端口无关。
# udp_drop_list包含目标UDP端口，该机制类似于udp_whitelist丢弃UDP数据包，但不会发送回ICMP消息。只有udp_whitelist允许的UDP数据包才能被udp_drop_list捕获。
# Quantumult不会处理到exclude_routes的流量。最好在修改后重新启动设备。
# 默认情况下（“回环”），当域名在DNS级别被拒绝时，将返回回环IP响应，您可以通过将dns_reject_domain_behavior设置为“无错误无答案”或“nxdomain”或“无”来更改此行为。这将改变行为，以响应NOERROR NOANSWER响应或响应NXDOMAIN响应或无响应，以禁用DNS级别拒绝功能。如果您将被拒绝的域更改为非被拒绝的域（通过更改配置、过滤器或策略），最多可能需要10秒才能生效（TTL 10）。
# resource_parser_url样本可以在https://raw.githubusercontent.com/crossutility/Quantumult-X/master/resource-parser.js上找到
# 仅当server_check_timeout值小于或等于5000（毫秒）时才会考虑该值。此值与检查过程的总持续时间（包括DNS查询、TCP握手、TLS握手和应用层HTTP会话持续时间）进行比较，因此总持续时间可能明显比“TCP握手”和“HTTP会话持续时间”长。
[general]
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
;profile_img_url =http://www.example.com/example.png
;resource_parser_url =http://www.example.com/parser.js
;network_check_url =http://bing.com
;server_check_url =http://www.google.com/generate_204
;server_check_user_agent = Agent/1.0
;server_check_timeout = 5000
;doh_user_agent = Agent/1.0
;geo_location_checker = http://www.example.com/json/,https://www.example.com/script.js
;running_mode_trigger = filter,filter,LINK_22E171:all_proxy,LINK_22E172:all_direct
dns_exclusion_list = *.cmpassport.com,*.jegotrip.com.cn,*.icitymobile.mobi,id6.me
;dns_reject_domain_behavior = loopback
;ssid_suspended_list = ASUSWiFi_5G,LINK_22E175
;enhanced_compatibility_ssid_list = LINK_22E174,LINK_22E175
;udp_whitelist = 53,123,1900,80-443
;udp_drop_list = 1900,80
;excluded_routes = 192.168.0.0/16,172.16.0.0/12,100.64.0.0/10,10.0.0.0/8
;icmp_auto_reply = true
#
# 从当前网络（系统）获取的DNS服务器将始终用于更好的性能（您可以使用“无系统”禁用此功能，但您至少应该添加一个自定义的DNS服务器，如“服务器=223.5.5.5”）。
# 当设置no-ipv6时，Quantumult X Tunnel的DNS模块将直接让AAAA查询失败，但仍允许来自IPv6 DNS服务器的A查询。
# 查询结果将仅用于评估过滤器或通过直接策略进行连接，当通过服务器连接时，结果将不会被使用，Quantumult永远不会知道相关域的目标IP。
# 当设置了prefer-doh3时，DoH查询将尝试DNS over HTTP3，如果失败，那么查询连接将回退到HTTP2。由于HTTP/2和HTTP/3连接支持多路复用，当您更改此设置时，它可能不会立即生效，但您可以重新连接Quantumult X Tunnel或手动更改网络环境，使其立即生效。
# 当设置doh-server（DNS over HTTPS）或doq-server（DNS over QUIC）时，系统和所有其他未加密的常规（没有特定的域与之绑定）服务器将被忽略。DoQ的默认端口是853，如果双方同意为您的DoQ使用另一个端口，如456，您可以将其设置为quic://dns.example.com:456
# 多个（并发查询）doq-server（s）或doh-server（s）应在一行中配置，URL应用逗号分隔。当doq-server（s）和doh-server（s）都设置后，查询将同时发送到所有服务器。
# 如果iOS版本<iOS 13.0，doh-servers的最大数量将限制为1。如果iOS版本<iOS 15.0，则doh服务器的最大数量将限制为2个。
# 这里不允许为域特别直接设置127.0.0.1。如果您希望某些域（例如：example.com）为127.0.0.1，只需在“filter_local”部分添加“host，example.com，reject”。拒绝操作将向查询返回127.0.0.1的DNS响应。
# circumvent-ipv4-answer和circuvent-ipv6-answer与上游DNS有关。如果来自上游的A或AAAA结果（IP）与该字段匹配，则该结果将被忽略并标记为失败。如果多个查询发送到不同的上游DNS服务器，并且第一个响应的上游结果与此字段匹配，Quantumult X Tunnel DNS模块将等待其他上游服务器的结果。
# ?和*可用于circuvent-ipv4-answer和circuvent-ipv6-answer。
# 如果您正在使用与上游DNS相关的广告，请将circuvent-ipv4-answer和circuvent-ipv6-answer留空。
#
[dns]
;circumvent-ipv4-answer = 127.0.0.1,0.0.0.0
;circumvent-ipv6-answer = ::
prefer-doh3
;no-system
no-ipv6
;server = 223.5.5.5
;server = 119.29.29.29
;server = 180.76.76.76
;doq-server = quic://dns.adguard.com
;doq-server = quic://dns1.example.com,quic://dns2.example.com
;doq-server = quic://dns.adguard.com,excluded_ssids=SSID1
;doq-server = quic://dns.adguard.com,included_ssids=SSID2
;doh-server = https://dns.alidns.com/dns-query
doh-server = https://doh.pub/dns-query,https://dns.alidns.com/dns-query
;doh-server = https://223.6.6.6/dns-query,excluded_ssids=SSID1
;doh-server = https://223.5.5.5/dns-query,included_ssids=SSID2
;server = 8.8.8.8:53,excluded_ssids=SSID1
;server = 8.8.4.4:53,included_ssids=SSID2
