#⚠️⚠️⚠️MITM中間人攻擊⚠️⚠️⚠️
# 如果TCP连接的源IP与skip_src_ip匹配，则不会评估主机名。通配符*和?被支持。
# 如果TCP连接的目标IP与skip_dst_ip匹配，则主机名将不会被评估。通配符*和?被支持。
# 只有“主机名”中的 TLS SNI 或目标地址才会由 MitM 处理。通配符*和?被支持。
# 重要！！！您应该始终将您的CA密码和p12保密。
[mitm]
passphrase = 75B85104
p12 = 
;passphrase =
;p12 =
;skip_validating_cert = false
;skip_src_ip = 192.168.1.5,192.168.1.6
;skip_dst_ip = 17.0.0.1
