#⚠️⚠️⚠️⚠️⚠️HTTP網路請求底層處理引擎
[http_backend]

#⚠️⚠️⚠️⚠️⚠️MITM中間人攻擊
# 如果TCP連線的來源IP與skip_src_ip比對相符，則不會評估主機名稱。萬用字元*和?支援。
# 如果TCP連線的目標IP與skip_dst_ip比對相符，則主機名稱將不會被評估。萬用字元*和?支援。
# 只有「主機名稱」中的 TLS SNI 或目標位址才會由 MitM 處理。萬用字元*和?支援。
# 重要！！！您應該始終將您的CA密碼和p12妥善保管。
[mitm]
passphrase = 75B85104
p12 = 
skip_validating_cert = true
hostname = maplocatesdksnapshot.d.meituan.net,metrics-picture.d.meituan.net,route-stats.d.meituan.net,*.google.cn,-*.apple.com,-*.icloud.com,-*.itunes.com,-*.facebook.com,-*.cdninstagram.com,-*.instagram.com,-*.twitter.com,-*.snssdk.com,-*.pstatp.com,-*.bdstatic.com

#⚠️⚠️⚠️⚠️⚠️DNS解析服務器設置
[dns]
#⚠️⚠️從當前網絡(system)取得的DNS伺服器將始終用於更好的效能（您可以使用「no-system」停用此功能，但您至少應該新增一個自訂的DNS伺服器，如「伺服器=223.5.5.5」）。
# no-system
#⚠️⚠️當設定no-ipv6時，Quantumult X Tunnel的DNS模組將直接讓AAAA查詢失敗，但仍允許來自IPv6 DNS伺服器的A查詢。
no-ipv6
#⚠️⚠️當設定了prefer-doh3時，DoH查詢將嘗試DNS over HTTP3，如果失敗，那麼查詢連線將退回使用HTTP2。
prefer-doh3
#⚠️⚠️加密DNS服務器
