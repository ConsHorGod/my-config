server_check_url = http://www.gstatic.com/generate_204
;server_check_user_agent = Agent/1.0
server_check_timeout = 3000
;doh_user_agent = Agent/1.0
;geo_location_checker = http://www.example.com/json/,https://www.example.com/script.js
;running_mode_trigger = filter,filter,LINK_22E171:all_proxy,LINK_22E172:all_direct
dns_exclusion_list = *.cmpassport.com,*.jegotrip.com.cn,*.icitymobile.mobi,id6.me
;dns_reject_domain_behavior = loopback
;ssid_suspended_list = ASUSWiFi_5G,LINK_22E175
;enhanced_compatibility_ssid_list = LINK_22E174,LINK_22E175
;udp_whitelist = 53,123,1900,80-443
;udp_drop_list = 1900,80
;excluded_routes = 192.168.0.0/16,172.16.0.0/12,100.64.0.0/10,10.0.0.0/8
;icmp_auto_reply = true
#
# 从当前网络（系统）获取的DNS服务器将始终用于更好的性能（您可以使用“无系统”禁用此功能，但您至少应该添加一个自定义的DNS服务器，如“服务器=223.5.5.5”）。
# 当设置no-ipv6时，Quantumult X Tunnel的DNS模块将直接让AAAA查询失败，但仍允许来自IPv6 DNS服务器的A查询。
# 查询结果将仅用于评估过滤器或通过直接策略进行连接，当通过服务器连接时，结果将不会被使用，Quantumult永远不会知道相关域的目标IP。
# 当设置了prefer-doh3时，DoH查询将尝试DNS over HTTP3，如果失败，那么查询连接将回退到HTTP2。由于HTTP/2和HTTP/3连接支持多路复用，当您更改此设置时，它可能不会立即生效，但您可以重新连接Quantumult X Tunnel或手动更改网络环境，使其立即生效。
# 当设置doh-server（DNS over HTTPS）或doq-server（DNS over QUIC）时，系统和所有其他未加密的常规（没有特定的域与之绑定）服务器将被忽略。DoQ的默认端口是853，如果双方同意为您的DoQ使用另一个端口，如456，您可以将其设置为quic://dns.example.com:456
# 多个（并发查询）doq-server（s）或doh-server（s）应在一行中配置，URL应用逗号分隔。当doq-server（s）和doh-server（s）都设置后，查询将同时发送到所有服务器。
# 如果iOS版本<iOS 13.0，doh-servers的最大数量将限制为1。如果iOS版本<iOS 15.0，则doh服务器的最大数量将限制为2个。
# 这里不允许为域特别直接设置127.0.0.1。如果您希望某些域（例如：example.com）为127.0.0.1，只需在“filter_local”部分添加“host，example.com，reject”。拒绝操作将向查询返回127.0.0.1的DNS响应。
# circumvent-ipv4-answer和circuvent-ipv6-answer与上游DNS有关。如果来自上游的A或AAAA结果（IP）与该字段匹配，则该结果将被忽略并标记为失败。如果多个查询发送到不同的上游DNS服务器，并且第一个响应的上游结果与此字段匹配，Quantumult X Tunnel DNS模块将等待其他上游服务器的结果。
# ?和*可用于circuvent-ipv4-answer和circuvent-ipv6-answer。
# 如果您正在使用与上游DNS相关的广告，请将circuvent-ipv4-answer和circuvent-ipv6-answer留空。
#

