#
# “reject”返回HTTP状态代码404，没有内容。这种类型的重写具有某种动态延迟（0~5秒）的响应机制，在短时间内重复请求。重复越少，延迟越短（0）。重复越多，延迟就越大（5）。
# “reject-200”返回HTTP状态代码200，没有内容。
# “reject-img”返回HTTP状态代码200，内容为1px gif。
# “reject-dict”返回HTTP状态代码200，内容为空json对象。
# “reject-array”返回HTTP状态代码200，内容为空json数组。
# “请求标头”适用于所有http标头，而不仅仅是单个标头，因此您可以在一个正则表达式中匹配两个或更多标头，包括CRLF。
# “回声响应”只需为匹配的URL回复内容类型响应的正文，正文文件应保存在“在我的iPhone上-Quantumult X-数据”。
# 如果“重写”与正文相关，则与长度和编码相关的HTTP标头字段将由Quantumult自动处理，因此您不应自行处理它们。脚本响应正文的最大支持原始响应正文大小为4 MB（iOS 13+）。
# 如果正文为空，则不会执行与正文相关的重写。
# 在重写中使用javascript时，您可以使用以下对象：$request、$response、$notify（标题、副标题、消息）、console.log（消息）和Quantumult的内置对象都有前缀“$”。
# 支持：$request.sessionIndex、$request.scheme、$request.method、$request.url、$request.path、$request.headers、$response.sessionIndex、$response.statusCode、$response.headers、$response.body
# 当响应与请求相关时，$request.sessionIndex等于$response.sessionIndex。会话索引与橙色“活动”面板中的TCP记录索引无关。
# 如果启用了Quantumult通知，$notify（标题、副标题、消息）将发布iOS通知。
# $prefs用于持久存储：$prefs.valueForKey(key)、$prefs.setValueForKey(value,key)、$prefs.removeValueForKey(key)、$prefs.removeAllValues()。
# console.log（消息）将把日志输出到Quantumult日志文件。
# setTimeout（function（）{ }，间隔）将在间隔（ms）后运行函数。
# 脚本请求标题、脚本请求正文、脚本响应标题、脚本响应正文、脚本回声响应和脚本分析回声响应的脚本应保存在本地“我的 iPhone 上 - Quantumult X - 脚本”或“iCloud 云盘 - Quantumult X - 脚本”中。样本可以在https://github.com/crossutility/Quantumult-X上找到
# 脚本分析回声响应和脚本回声响应之间的区别在于，前者将等待请求正文。
# 如果URL和标题都匹配用于网址和标题重写，则HTTP（HTTPS）请求将被匹配（URL将首先被评估，如果它不匹配，则标题将根本不被评估）。要比较的标题字符串包含方法、路径和键值标题。
#
[rewrite_local]
#Google重定向
^https?:\/\/(www.)?(g|google)\.cn url 302 https://www.google.com
^https?:\/\/(ditu|maps).google\.cn url 302 https://maps.google.com
#
#
# 如果设置了require-devices，只有当当前Quantumult设备ID属于require-devices时，才会加载此配置行。Quantumult设备ID可以在“设置-杂项设置-关于”中找到。
# $task.fetch（）组成HTTP请求并处理响应，仅支持文本正文。如果您想要串行请求而不是当前请求，$task.fetch()可以嵌入到另一个$task.fetch()的完成处理程序中。
# 脚本应保存在本地“在我的 iPhone 上 - Quantumult X - 脚本”或“iCloud 云盘 - Quantumult X - 脚本”中。样本可以在https://github.com/crossutility/Quantumult-X/blob/master/sample-task.js上找到
# 默认的HTTP请求超时为10秒。
# 支持 5 或 6 个 cron 字段，不包括命令字段。当网络发生变化时，事件网络将被触发。当用户点击UIAction时，将触发事件交互。只有在Quantumult X Tunnel运行时才能触发与事件相关的任务。
#
[task_local]
;* * * * * sample-task.js
;* * * * * sample-task2.js,img-url=https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png,tag=Sample,enabled=true
;* * * * * sample-task3.js,img-url=https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png,tag=Sample,require-devices=ID1,ID2,enabled=true
;event-network sample-task3.js
;event-interaction sample-task4.js
